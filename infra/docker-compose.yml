name: earnings-agent

x-app-env: &app-env
  DATABASE_URL: postgres://eia:eia@db:5432/eia
  RAW_DATA_DIR: /data/raw
  CACHE_DIR: /data/cache

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eia
      POSTGRES_PASSWORD: eia
      POSTGRES_DB: eia
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eia -d eia"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "--filter", "@eia/db", "migrate"]
    env_file: ../.env
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      <<: *app-env
      MODE: http
    ports:
      - "8080:8080"
    volumes:
      - rawdata:/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      <<: *app-env
      MODE: worker
    volumes:
      - rawdata:/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  rawdata:
